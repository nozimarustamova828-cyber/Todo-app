<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vazifalar — Todo</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f0faf4;
            --surface: #ffffff;
            --surface2: #e8f5ee;
            --border: #c3e6ce;
            --accent: #22a55b;
            --accent-glow: rgba(34, 165, 91, 0.15);
            --accent-dim: #1a8a4a;
            --green: #22a55b;
            --green-dim: rgba(34, 165, 91, 0.12);
            --red: #e05252;
            --red-dim: rgba(224, 82, 82, 0.1);
            --text: #1a2e22;
            --text-muted: #5a8a6a;
            --text-dim: #a0c4ae;
            --radius: 14px;
            --radius-sm: 8px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 60px 16px 100px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .app {
            width: 100%;
            max-width: 520px;
            position: relative;
            z-index: 1;
            animation: fadeUp 0.6s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .header { margin-bottom: 36px; }

        .header-top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 8px;
        }

        .logo {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent), #4ade80);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 24px var(--accent-glow);
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text);
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 300;
            padding-left: 56px;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            padding: 14px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 2px 12px rgba(34,165,91,0.08);
        }

        .stat { display: flex; flex-direction: column; gap: 2px; }

        .stat-num {
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .stat-divider { width: 1px; background: var(--border); margin: 2px 0; }

        .progress-wrap {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            width: 80px;
            margin: auto 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #4ade80);
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        .input-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 24px;
            transition: border-color 0.2s;
            box-shadow: 0 2px 12px rgba(34,165,91,0.08);
        }

        .input-card:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input-row { display: flex; gap: 10px; }

        .todo-input {
            flex: 1;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .todo-input::placeholder { color: var(--text-dim); }
        .todo-input:focus { border-color: var(--accent); }

        .add-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--accent), #4ade80);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.2s;
            white-space: nowrap;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .add-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px var(--accent-glow); }
        .add-btn:active { transform: translateY(0); }
        .add-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .filters {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            background: var(--surface);
            padding: 5px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(34,165,91,0.06);
        }

        .filter-btn {
            flex: 1;
            padding: 8px;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--green-dim);
            color: var(--accent);
            font-weight: 600;
        }

        .todo-list { display: flex; flex-direction: column; gap: 8px; }

        .todo-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            animation: slideIn 0.3s ease both;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 1px 4px rgba(34,165,91,0.06);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .todo-item:hover {
            border-color: var(--accent);
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .todo-item.completed {
            background: #f0fdf6;
            border-color: #bbf7d0;
        }

        .todo-item.removing {
            animation: slideOut 0.3s ease both;
        }

        @keyframes slideOut {
            to { opacity: 0; transform: translateX(20px); max-height: 0; padding: 0; margin: 0; }
        }

        .check-btn {
            width: 22px;
            height: 22px;
            min-width: 22px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 12px;
            color: transparent;
        }

        .check-btn:hover { border-color: var(--green); background: var(--green-dim); }

        .check-btn.checked {
            background: var(--green-dim);
            border-color: var(--green);
            color: var(--green);
        }

        .todo-text {
            flex: 1;
            font-size: 15px;
            color: var(--text);
            word-break: break-word;
            transition: all 0.2s;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: var(--text-dim);
        }

        .del-btn {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s;
            opacity: 0;
        }

        .todo-item:hover .del-btn { opacity: 1; }

        .del-btn:hover {
            background: var(--red-dim);
            border-color: rgba(224,82,82,0.2);
            color: var(--red);
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }

        .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
        .empty-title { font-family: 'Syne', sans-serif; font-size: 18px; color: var(--text-muted); margin-bottom: 6px; }
        .empty-sub { font-size: 13px; }

        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--accent);
            border-radius: 40px;
            padding: 10px 22px;
            font-size: 13px;
            color: white;
            font-weight: 500;
            box-shadow: 0 8px 24px var(--accent-glow);
            opacity: 0;
            transition: all 0.3s;
            z-index: 100;
            pointer-events: none;
        }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .skeleton {
            background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: var(--radius);
            height: 52px;
            border: 1px solid var(--border);
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <div class="header-top">
            <div class="logo">✦</div>
            <h1>Vazifalar</h1>
        </div>
        <p class="subtitle">Bugungi ishlaringizni tartibga soling</p>

        <div class="stats-bar">
            <div class="stat">
                <span class="stat-num" id="stat-total">0</span>
                <span class="stat-label">Jami</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat">
                <span class="stat-num" id="stat-done">0</span>
                <span class="stat-label">Bajarildi</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat">
                <span class="stat-num" id="stat-left">0</span>
                <span class="stat-label">Qoldi</span>
            </div>
            <div style="flex:1"></div>
            <div class="progress-wrap">
                <div class="progress-bar" id="progress-bar" style="width:0%"></div>
            </div>
        </div>
    </div>

    <div class="input-card">
        <div class="input-row">
            <input class="todo-input" id="todo-input" type="text"
                placeholder="Yangi vazifa yozing..." maxlength="200" autocomplete="off">
            <button class="add-btn" id="add-btn" onclick="addTodo()">+ Qo'shish</button>
        </div>
    </div>

    <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all', this)">Barchasi</button>
        <button class="filter-btn" onclick="setFilter('active', this)">Faol</button>
        <button class="filter-btn" onclick="setFilter('done', this)">Bajarilgan</button>
    </div>

    <div class="todo-list" id="todo-list">
        <div class="skeleton"></div>
        <div class="skeleton" style="opacity:.6"></div>
        <div class="skeleton" style="opacity:.3"></div>
    </div>
</div>

<div class="toast" id="toast"></div>
<script>
    let todos = [];
    let currentFilter = 'all';
    let useLocalStorage = false;

    async function api(path, method = 'GET', body = null) {
        const opts = { method, headers: { 'Content-Type': 'application/json' } };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(path, opts);
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || 'Xatolik yuz berdi');
        }
        return res.json();
    }

    function render() {
        const list = document.getElementById('todo-list');
        const filtered = todos.filter(t => {
            if (currentFilter === 'active') return !t.completed;
            if (currentFilter === 'done') return t.completed;
            return true;
        });

        const total = todos.length;
        const done = todos.filter(t => t.completed).length;
        document.getElementById('stat-total').textContent = total;
        document.getElementById('stat-done').textContent = done;
        document.getElementById('stat-left').textContent = total - done;
        const pct = total ? Math.round((done / total) * 100) : 0;
        document.getElementById('progress-bar').style.width = pct + '%';

        if (filtered.length === 0) {
            const msgs = {
                all: ['📭', 'Vazifalar yo\'q', 'Birinchi vazifangizni qo\'shing!'],
                active: ['✅', 'Ajoyib!', 'Barcha vazifalar bajarildi.'],
                done: ['🎯', 'Hali hech narsa yo\'q', 'Vazifalarni bajarib belgilang.']
            };
            const [icon, title, sub] = msgs[currentFilter];
            list.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">${icon}</div>
                    <div class="empty-title">${title}</div>
                    <div class="empty-sub">${sub}</div>
                </div>`;
            return;
        }

        list.innerHTML = '';
        filtered.forEach((todo, i) => {
            const el = document.createElement('div');
            el.className = 'todo-item' + (todo.completed ? ' completed' : '');
            el.dataset.id = todo.id;
            el.style.animationDelay = (i * 40) + 'ms';

            const checkBtn = document.createElement('button');
            checkBtn.className = 'check-btn' + (todo.completed ? ' checked' : '');
            checkBtn.onclick = () => toggleTodo(todo.id);
            checkBtn.title = todo.completed ? 'Bekor qilish' : 'Bajarildi deb belgilash';
            checkBtn.textContent = todo.completed ? '✓' : '';

            const textSpan = document.createElement('span');
            textSpan.className = 'todo-text';
            textSpan.textContent = todo.title;

            const delBtn = document.createElement('button');
            delBtn.className = 'del-btn';
            delBtn.onclick = () => deleteTodo(todo.id);
            delBtn.title = "O'chirish";
            delBtn.textContent = '✕';

            el.appendChild(checkBtn);
            el.appendChild(textSpan);
            el.appendChild(delBtn);
            list.appendChild(el);
        });
    }

    async function loadTodos() {
        try {
            todos = await api('/api/todos');
            useLocalStorage = false;
            render();
        } catch (e) {
            console.warn("API is not available, falling back to localStorage:", e);
            useLocalStorage = true;
            todos = JSON.parse(localStorage.getItem('todos') || '[]');
            render();
        }
    }

    async function addTodo() {
        const input = document.getElementById('todo-input');
        const btn = document.getElementById('add-btn');
        const title = input.value.trim();
        if (!title) {
            input.focus();
            input.style.borderColor = '#e05252';
            setTimeout(() => input.style.borderColor = '', 800);
            return;
        }
        btn.disabled = true;
        btn.textContent = '...';
        try {
            if (useLocalStorage) {
                const newId = Math.max(...todos.map(t => t.id), 0) + 1;
                const newTodo = {
                    id: newId,
                    title: title,
                    completed: false
                };
                todos.push(newTodo);
                localStorage.setItem('todos', JSON.stringify(todos));
                input.value = '';
                currentFilter = 'all';
                document.querySelectorAll('.filter-btn').forEach((b, i) => {
                    b.classList.toggle('active', i === 0);
                });
                render();
                showToast('✦ Vazifa qo\'shildi');
            } else {
                const newTodo = await api('/api/todos', 'POST', { title });
                todos.push(newTodo);
                input.value = '';
                currentFilter = 'all';
                document.querySelectorAll('.filter-btn').forEach((b, i) => {
                    b.classList.toggle('active', i === 0);
                });
                render();
                showToast('✦ Vazifa qo\'shildi');
            }
        } catch (e) {
            showToast('❌ ' + e.message);
        } finally {
            btn.disabled = false;
            btn.textContent = '+ Qo\'shish';
        }
    }

    async function toggleTodo(id) {
        const todo = todos.find(t => t.id === id);
        if (!todo) return;
        try {
            if (useLocalStorage) {
                todo.completed = !todo.completed;
                localStorage.setItem('todos', JSON.stringify(todos));
                render();
                if (todo.completed) showToast('✅ Bajarildi!');
            } else {
                const updated = await api(`/api/todos/${id}`, 'PATCH', { completed: !todo.completed });
                todo.completed = updated.completed;
                render();
                if (todo.completed) showToast('✅ Bajarildi!');
            }
        } catch (e) {
            showToast('❌ ' + e.message);
        }
    }

    async function deleteTodo(id) {
        const el = document.querySelector(`.todo-item[data-id="${id}"]`);
        if (el) el.classList.add('removing');
        setTimeout(async () => {
            try {
                if (useLocalStorage) {
                    todos = todos.filter(t => t.id !== id);
                    localStorage.setItem('todos', JSON.stringify(todos));
                    render();
                    showToast("🗑️ O'chirildi");
                } else {
                    await api(`/api/todos/${id}`, 'DELETE');
                    todos = todos.filter(t => t.id !== id);
                    render();
                    showToast("🗑️ O'chirildi");
                }
            } catch (e) {
                showToast('❌ ' + e.message);
                render();
            }
        }, 250);
    }

    function setFilter(filter, btn) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    let toastTimer;
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
    }

    document.getElementById('todo-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') addTodo();
    });

    loadTodos();
</script>
</body>
</html>
